<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="figure-1-title figure-1-description"><title id="figure-1-title">Architecture and allocation</title><desc id="figure-1-description">All participants and directed labeled relations from the authored source graph. This is a logical presentation, not formal SysML or executed behavior.</desc><defs><marker id="figure-1-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/></marker></defs><g data-from="S" data-to="E" data-interface="IFC-01"><path d="M250,111.0 L350.0,111.0 L350.0,184.0 L450,184.0" fill="none" stroke="white" stroke-width="7"/><path d="M250,111.0 L350.0,111.0 L350.0,184.0 L450,184.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#figure-1-arrow)"/><text x="350.0" y="84.0" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="14"><tspan x="350.0">IFC-01</tspan><tspan x="350.0" dy="18">time and temperature</tspan></text></g><g data-from="U" data-to="E" data-interface="IFC-02"><path d="M250,281.0 L350.0,281.0 L350.0,208.0 L450,208.0" fill="none" stroke="white" stroke-width="7"/><path d="M250,281.0 L350.0,281.0 L350.0,208.0 L450,208.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#figure-1-arrow)"/><text x="350.0" y="312.0" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="14"><tspan x="350.0">IFC-02</tspan><tspan x="350.0" dy="18">acknowledgement</tspan></text></g><g data-from="E" data-to="A" data-interface="IFC-03"><path d="M670,184.0 L770.0,184.0 L770.0,111.0 L870,111.0" fill="none" stroke="white" stroke-width="7"/><path d="M670,184.0 L770.0,184.0 L770.0,111.0 L870,111.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#figure-1-arrow)"/><text x="770.0" y="84.0" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="14"><tspan x="770.0">IFC-03</tspan><tspan x="770.0" dy="18">high OR fault</tspan></text></g><g data-from="E" data-to="L" data-interface="IFC-04"><path d="M670,208.0 L770.0,208.0 L770.0,281.0 L870,281.0" fill="none" stroke="white" stroke-width="7"/><path d="M670,208.0 L770.0,208.0 L770.0,281.0 L870,281.0" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#figure-1-arrow)"/><text x="770.0" y="312.0" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="14"><tspan x="770.0">IFC-04</tspan><tspan x="770.0" dy="18">transition record</tspan></text></g><g data-node="S" aria-label="COMP-01 Sensor adapter"><rect x="30" y="75.0" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="105.0" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="17"><tspan x="140.0" dy="0">COMP-01</tspan><tspan x="140.0" dy="24">Sensor adapter</tspan></text></g><g data-node="E" aria-label="COMP-02 Evaluator"><rect x="450" y="160.0" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="560.0" y="190.0" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="17"><tspan x="560.0" dy="0">COMP-02</tspan><tspan x="560.0" dy="24">Evaluator</tspan></text></g><g data-node="U" aria-label="ACTOR-01 Technician"><rect x="30" y="245.0" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="140.0" y="275.0" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="17"><tspan x="140.0" dy="0">ACTOR-01</tspan><tspan x="140.0" dy="24">Technician</tspan></text></g><g data-node="A" aria-label="COMP-03 Annunciator"><rect x="870" y="75.0" width="220" height="72" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="980.0" y="105.0" text-anchor="middle" fill="#172554" font-family="system-ui,sans-serif" font-size="17"><tspan x="980.0" dy="0">COMP-03</tspan><tspan x="980.0" dy="24">Annunciator</tspan></text></g><g d